server:
  port: 8080
spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: PHARMADB
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
app:
  jwt:
    # Solo desarrollo local. En producción se configura por variable de entorno.
    secret: ${JWT_SECRET}
    expiracion-minutos: 60
